name: web-mindmap
services:
  app:
    build:
      context: .
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./data:/app/data
      - ./backup:/app/backup
    environment:
      PORT: "4173"
      MINDMAP_BIND_HOST: "0.0.0.0"
      MINDMAP_DATA_DIR: /app/data
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

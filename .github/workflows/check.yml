name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install verified Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Check all fetched Git history for secrets
        run: gitleaks git --redact --log-opts=--all
      - name: Reject private/runtime files and personal paths
        run: node scripts/check-publication.mjs --ref HEAD
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Verify packaged Docker runtime without network or host data
        shell: bash
        run: |
          image="web-mindmap-ci:${GITHUB_SHA}"
          name="web-mindmap-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$image" .
          task_container=$(docker create --network none --name "$name" "$image")
          trap 'docker rm --force "$task_container" >/dev/null 2>&1 || true' EXIT
          docker start "$task_container" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$task_container" node -e "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$task_container"
          exit 1
